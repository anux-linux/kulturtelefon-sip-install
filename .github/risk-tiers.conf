# Risk tiers of kulturtelefon-sip-install: the single source of truth.
# Read by scripts/risk-tier.sh and .claude/hooks/require-merge-checks.sh (from ai-suite);
# scripts/validate.sh checks that every high pattern is also in .github/CODEOWNERS.
#
# Format:  <tier>  <glob>        tier = low | medium | high
# A file takes the highest tier of any pattern it matches ('*' also matches '/').
# A file matching no pattern is treated as MEDIUM. A change takes the highest tier of its files.
# A high pattern is a directory ending in '/*' or an exact file, or validate.sh and CODEOWNERS break.

# ai-suite harness and review rules
high    .claude/hooks/*
high    .claude/settings.json
high    .github/workflows/*
high    .github/CODEOWNERS
high    .github/risk-tiers.conf
high    REVIEW.md

# Everything the installer runs or writes, as root on a host reachable from the internet
high    src/*

medium  .claude/agents/*
medium  .claude/skills/*
medium  .claude/commands/*
medium  scripts/*
medium  CLAUDE.md

low     docs/*
low     templates/*
low     README.md
low     LICENSE
low     .github/pull_request_template.md
